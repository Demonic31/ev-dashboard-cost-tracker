<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard e-208</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<script src="static/vendor/chart.umd.min.js"></script>
<script src="static/theme.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2430; --muted: #6b7585; --border: #e3e7ee;
    --accent: #0f766e; --bleu: #2563eb; --bleu-hc: #1e40af; --blanc: #94a3b8; --blanc-hc: #64748b;
    --rouge: #dc2626; --rouge-hc: #991b1b; --base: #a8a29e; --petrol: #b45309; --good: #15803d; --bad: #b91c1c; --lvl-l: 40%;
    --shadow: 0 1px 3px rgba(15, 23, 42, .08); --logo: none; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141b; --card: #171e28; --text: #e6ebf2; --muted: #8a96a8; --border: #263040;
      --accent: #2dd4bf; --blanc: #cbd5e1; --blanc-hc: #94a3b8; --base: #78716c; --petrol: #f59e0b; --good: #4ade80; --bad: #f87171; --lvl-l: 60%;
      --shadow: none; --logo: invert(1); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141b; --card: #171e28; --text: #e6ebf2; --muted: #8a96a8; --border: #263040;
    --accent: #2dd4bf; --blanc: #cbd5e1; --blanc-hc: #94a3b8; --base: #78716c; --petrol: #f59e0b; --good: #4ade80; --bad: #f87171; --lvl-l: 60%;
    --shadow: none; --logo: invert(1); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px;
           margin-bottom: 16px; }
  h1 { font-size: 1.5rem; margin: 0; display: flex; align-items: center; gap: 10px; }
  h1 .logo { height: 1.9rem; width: auto; filter: var(--logo); }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  h2 small { color: var(--muted); font-weight: 400; font-size: .8rem; margin-left: 6px; }
  td small { color: var(--muted); font-size: .8em; }
  .meta { color: var(--muted); font-size: .85rem; display: flex; gap: 12px; align-items: center; }
  button, select, input { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
           padding: 6px 10px; font: inherit; font-size: .85rem; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  [hidden] { display: none !important; }
  .meta button { height: 2rem; display: inline-flex; align-items: center; justify-content: center; }
  #refresh, #theme, #logout { padding: 0 9px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
          box-shadow: var(--shadow); min-width: 0; }
  .period { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 16px; padding: 10px 16px; }
  .period label { color: var(--muted); font-size: .85rem; }
  .period .range { color: var(--muted); font-size: .85rem; margin-left: auto; }
  .soh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-bottom: 16px; padding: 10px 16px; }
  .soh .label { color: var(--muted); font-size: .85rem; }
  .soh .n { font-size: 1.25rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .soh .gauge { width: 140px; margin-top: 0; }
  .soh small { color: var(--muted); font-size: .76rem; }
  .car { margin-bottom: 16px; }
  .car .items { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 640px) { .car .items { grid-template-columns: 1fr 1fr; } }
  .car .label { color: var(--muted); font-size: .78rem; margin-bottom: 2px; }
  .car .n { font-size: 1.35rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .car .n small { font-size: .8rem; color: var(--muted); font-weight: 400; }
  .car .level { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-top: 6px; }
  .car .level span { display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #dc2626, #f59e0b 35%, #16a34a 75%); }
  .state { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
  .car .sub { color: var(--muted); font-size: .76rem; margin-top: 4px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi .label { color: var(--muted); font-size: .8rem; }
  .kpi .value { font-size: 1.45rem; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .sub { color: var(--muted); font-size: .78rem; }
  .kpi.main .value { color: var(--accent); }
  .offers { margin-bottom: 16px; }
  .offers.last { margin: 16px 0 0; }
  .offer { display: grid; grid-template-columns: minmax(150px, 1.2fr) 2.2fr minmax(90px, auto) minmax(120px, auto);
           gap: 4px 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .offer:last-of-type { border-bottom: 0; }
  .offer .name { font-weight: 600; } .offer .name small { display: block; color: var(--muted); font-weight: 400; font-size: .76rem; }
  .offer .cost { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
  .offer .delta { text-align: right; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .offer .delta.up { color: var(--bad); } .offer .delta.down { color: var(--good); }
  .offer.ref .name, .offer.ref .cost { color: var(--accent); }
  .offer .track { height: 10px; border-radius: 5px; background: var(--border); overflow: hidden; }
  .offer .track span { display: block; height: 100%; border-radius: 5px; }
  .offer .missing { color: var(--muted); font-size: .82rem; grid-column: 2 / -1; }
  .notes { color: var(--muted); font-size: .76rem; margin: 10px 0 0; padding-left: 18px; }
  @media (max-width: 640px) {
    .offer { grid-template-columns: 1fr auto; }
    .offer .track { grid-column: 1 / -1; grid-row: 2; }
    .offer .delta { grid-column: 2; }
  }
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid2 > .card { display: flex; flex-direction: column; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .chart { position: relative; height: 280px; }
  .empty { color: var(--muted); font-size: .9rem; padding: 24px 0; text-align: center; }
  .stock { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stock .n { font-size: 1.35rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stock .n small { font-size: .8rem; color: var(--muted); font-weight: 400; }
  .stock .label { color: var(--muted); font-size: .78rem; }
  .gauge { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin-top: 4px; }
  .gauge span { display: block; height: 100%; }
  .tomorrow { font-size: .85rem; color: var(--muted); margin-bottom: 12px; }
  .months { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px 8px; }
  @media (min-width: 1100px) { .months { grid-template-columns: repeat(12, 1fr); } }
  .season-card { margin-bottom: 16px; }
  .month .title { font-size: .72rem; color: var(--muted); margin-bottom: 3px; text-transform: capitalize; }
  .month .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .day { aspect-ratio: 1; border-radius: 2px; background: transparent; outline: 1px solid var(--border); outline-offset: -1px; }
  .day.pad { outline: none; }
  .day.BLEU { background: var(--bleu); outline: none; } .day.BLANC { background: var(--blanc); outline: none; }
  .day.ROUGE { background: var(--rouge); outline: none; }
  .day.today { box-shadow: 0 0 0 2px var(--text); }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: .78rem; margin-top: 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button.active { background: var(--accent); color: var(--card); border-color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  th:first-child, td:first-child, td.text { text-align: left; }
  td.note { white-space: normal; min-width: 160px; color: var(--muted); text-align: left; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600; color: #fff; }
  .pill.BLEU { background: var(--bleu); } .pill.BLANC { background: var(--blanc); color: #1d2430; }
  .pill.ROUGE { background: var(--rouge); }
  tr.fold { cursor: pointer; }
  tr.fold:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .chev { display: inline-block; width: 1em; color: var(--muted); transition: transform .15s; }
  tr.fold[aria-expanded="true"] .chev, details.cal[open] .chev { transform: rotate(90deg); }
  details.cal summary { cursor: pointer; list-style: none; font-size: .85rem; font-weight: 600; user-select: none; }
  details.cal summary::-webkit-details-marker { display: none; }
  details.cal[open] summary { margin-bottom: 10px; }
  tr.month-row td { font-weight: 600; }
  tr.month-row td:first-child { text-transform: capitalize; }
  tr.month-row td small { font-weight: 400; }
  tr[data-in] > td:first-child { padding-left: 26px; }
  tr.curve-row > td { padding: 0 0 12px; text-align: left; white-space: normal; }
  .curve { position: sticky; left: 0; padding: 4px 10px 0; }
  .curve .plot { position: relative; height: 220px; }
  .curve .hint { color: var(--muted); font-size: .78rem; margin-top: 6px; }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--border); min-width: 90px; }
  .error { background: #fee2e2; color: #991b1b; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1><img class="logo" src="static/vendor/peugeot-logo.svg" alt="Peugeot">Dashboard e-208</h1>
    <div class="meta"><span id="fetched">Chargement…</span><button id="refresh" type="button" title="Actualiser" aria-label="Actualiser">🔄</button><button id="theme" type="button"></button><button id="logout" type="button" hidden title="Se déconnecter">Déconnexion</button></div>
  </header>
  <div class="error" id="error"></div>

  <section class="card soh" id="soh" hidden></section>

  <section class="card car" id="car" hidden>
    <h2>🚗 Voiture <small id="carAt"></small></h2>
    <div class="items" id="carItems"></div>
  </section>

  <section class="card period">
    <label for="preset">Période</label>
    <select id="preset">
      <option value="all">Tout</option>
      <option value="season">Saison Tempo en cours</option>
      <option value="prevseason">Saison Tempo précédente</option>
      <option value="last12">12 derniers mois</option>
      <option value="year">Année civile en cours</option>
      <option value="month">Mois en cours</option>
      <option value="prevmonth">Mois précédent</option>
      <option value="custom">Personnalisée…</option>
    </select>
    <span id="customDates" hidden>
      <input type="date" id="from" aria-label="Du"> → <input type="date" id="to" aria-label="Au">
    </span>
    <span class="range" id="rangeText"></span>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="grid2">
    <div class="card">
      <h2>Coût par mois</h2>
      <div class="chart"><canvas id="monthsChart"></canvas></div>
      <div class="empty" id="monthsEmpty" hidden>Aucune recharge sur la période</div>
    </div>
    <div class="card">
      <h2>Énergie par tranche Tempo</h2>
      <div class="chart"><canvas id="tranchesChart"></canvas></div>
      <div class="empty" id="tranchesEmpty" hidden>Pas de kWh sur la période</div>
    </div>
  </section>

  <section class="card season-card">
    <h2>Saison Tempo <small id="seasonName"></small></h2>
    <div id="season"><div class="empty">Chargement…</div></div>
  </section>

  <section class="card">
    <div class="tabs">
      <button type="button" class="active" data-tab="charges">Recharges</button>
      <button type="button" data-tab="trips">Trajets</button>
    </div>
    <div class="table-wrap" id="table"></div>
  </section>

  <section class="card offers last">
    <h2>Comparatif des offres <small>même énergie, même kilométrage, sur la période</small></h2>
    <div id="offers"></div>
  </section>
</main>

<script src="static/app.js"></script>
</body>
</html>
