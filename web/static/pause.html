<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PREPROD en pause · Dashboard VE</title>
<link rel="icon" href="/static/favicon-test.svg" type="image/svg+xml">
<script src="/static/theme.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2430; --muted: #6b7686; --border: #e3e7ee;
    --accent: #0f766e; --shadow: 0 1px 3px rgba(15, 23, 42, .08); color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141b; --card: #171e28; --text: #e6ebf2; --muted: #8a96a8; --border: #263040;
      --accent: #2dd4bf; --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141b; --card: #171e28; --text: #e6ebf2; --muted: #8a96a8; --border: #263040;
    --accent: #2dd4bf; --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg);
         color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
         box-shadow: var(--shadow); padding: 24px; display: grid; gap: 12px; text-align: center; }
  img { display: block; width: 120px; height: 120px; margin: -8px auto 0; }
  h1 { font-size: 1.3rem; margin: 0; }
  p { margin: 0; color: var(--muted); }
  .button { display: block; margin-top: 6px; font-weight: 600; color: var(--card); background: var(--accent);
            border-radius: 8px; padding: 10px; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="/static/favicon-test.svg" alt="">
  <h1>PREPROD en pause</h1>
  <p>La préproduction du dashboard est arrêtée pour le moment. Elle sera relancée pour le prochain test.</p>
  {{link}}
</main>
</body>
</html>
