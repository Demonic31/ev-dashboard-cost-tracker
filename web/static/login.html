<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard VE · Login</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<link rel="manifest" href="static/manifest.webmanifest">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<script src="static/pwa.js"></script>
<script src="static/theme.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2430; --muted: #6b7686; --border: #e3e7ee;
    --accent: #0f766e; --bad: #b91c1c; --shadow: 0 1px 3px rgba(15, 23, 42, .08); color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141b; --card: #171e28; --text: #e6ebf2; --muted: #8a96a8; --border: #263040;
      --accent: #2dd4bf; --bad: #f87171; --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141b; --card: #171e28; --text: #e6ebf2; --muted: #8a96a8; --border: #263040;
    --accent: #2dd4bf; --bad: #f87171; --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 14px; padding: 16px; background: var(--bg);
         color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
         box-shadow: var(--shadow); padding: 24px; display: grid; gap: 14px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; text-align: center; }
  .brand { display: block; width: 120px; height: 120px; margin: -8px auto -14px; }
  label { display: grid; gap: 6px; color: var(--muted); font-size: .85rem; }
  input[type=password], input[name=code] { font: inherit; color: var(--text); background: var(--bg);
                                          border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; }
  input[type=password]:focus, input[name=code]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .remember { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: .9rem; }
  button { font: inherit; font-weight: 600; color: var(--card); background: var(--accent); border: 0; border-radius: 8px;
           padding: 10px; cursor: pointer; }
  #theme { font: inherit; font-size: .8rem; font-weight: 400; color: var(--muted); background: none;
           border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; }
  #theme:hover { color: var(--text); }
  .error { margin: 0; color: var(--bad); font-size: .9rem; }
</style>
</head>
<body>
<form method="post" action="login">
  <img class="brand" src="static/favicon.svg" alt="">
  <h1>Dashboard VE · Login</h1>
  {{message}}
  <label>Mot de passe
    <input type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  {{totp}}
  <label class="remember"><input type="checkbox" name="remember" value="1"> Se souvenir de moi (30 jours)</label>
  <button type="submit">Se connecter</button>
</form>
<button id="theme" type="button"></button>
<script src="static/login.js"></script>
</body>
</html>
