<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connexion · Dashboard e-208</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<script src="static/theme.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2430; --muted: #6b7686; --border: #e3e7ee;
    --accent: #0f766e; --bad: #b91c1c; --shadow: 0 1px 3px rgba(15, 23, 42, .08); --logo: none; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141b; --card: #171e28; --text: #e6ebf2; --muted: #8a96a8; --border: #263040;
      --accent: #2dd4bf; --bad: #f87171; --shadow: none; --logo: invert(1); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141b; --card: #171e28; --text: #e6ebf2; --muted: #8a96a8; --border: #263040;
    --accent: #2dd4bf; --bad: #f87171; --shadow: none; --logo: invert(1); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg);
         color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
         box-shadow: var(--shadow); padding: 24px; display: grid; gap: 14px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  h1 img { height: 1.7rem; filter: var(--logo); }
  label { display: grid; gap: 6px; color: var(--muted); font-size: .85rem; }
  input[type=password] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
                         border-radius: 8px; padding: 9px 11px; }
  input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .remember { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: .9rem; }
  button { font: inherit; font-weight: 600; color: var(--card); background: var(--accent); border: 0; border-radius: 8px;
           padding: 10px; cursor: pointer; }
  .error { margin: 0; color: var(--bad); font-size: .9rem; }
</style>
</head>
<body>
<form method="post" action="login">
  <h1><img src="static/vendor/peugeot-logo.svg" alt="">Dashboard e-208</h1>
  {{message}}
  <label>Mot de passe
    <input type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  <label class="remember"><input type="checkbox" name="remember" value="1"> Se souvenir de moi (30 jours)</label>
  <button type="submit">Se connecter</button>
</form>
</body>
</html>
