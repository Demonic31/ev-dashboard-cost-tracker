<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors connexion · Dashboard VE</title>
<style>
  :root { --bg: #f4f6f9; --card: #ffffff; --text: #1d2430; --muted: #6b7686; --border: #e3e7ee; --accent: #0f766e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f141b; --card: #171e28; --text: #e6ebf2; --muted: #8a96a8; --border: #263040; --accent: #2dd4bf; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px;
         text-align: center; }
  img { width: 120px; height: 120px; margin: -8px auto -14px; display: block; opacity: .6; }
  p { color: var(--muted); }
  a { display: inline-block; font-weight: 600; color: var(--card); background: var(--accent); border-radius: 8px;
      padding: 10px 18px; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="/static/favicon.svg" alt="">
  <h1>Hors connexion</h1>
  <p>Le dashboard n'est pas joignable pour l'instant. Vérifie ta connexion Internet puis réessaie.</p>
  <a href="/">Réessayer</a>
</main>
</body>
</html>
