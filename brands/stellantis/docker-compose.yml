# Services de la marque Stellantis (Peugeot, Citroën, DS, Opel, Vauxhall), inclus par le docker-compose.yml racine.
# Les chemins relatifs partent de ce dossier : les données restent à la racine du dépôt (psacc/config, secrets/).
services:
  psacc:
    image: flobz/psa_car_controller:${PSACC_VERSION:-v3.7.10}
    container_name: psacc
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      # Valeur par défaut de l'image, explicitée : -r = enregistrement trajets/charges
      PSACC_OPTIONS: "-c -r --web-conf"
    ports:
      # Lié à l'IP LAN uniquement (pas 0.0.0.0)
      - "${LAN_IP:?LAN_IP manquant dans .env}:5000:5000"
    volumes:
      - ../../psacc/config:/config

  psacc-sheets-sync:
    build: ./sync
    image: psacc-sheets-sync:local
    container_name: psacc-sheets-sync
    restart: unless-stopped
    depends_on:
      - psacc
    environment:
      TZ: Europe/Paris
      SPREADSHEET_ID: ${SPREADSHEET_ID:?SPREADSHEET_ID manquant dans .env}
      VIN: ${VIN:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-3600}
      DRY_RUN: ${DRY_RUN:-false}
      WAKEUP_AT: ${WAKEUP_AT-03:00,05:55}
      # Contrôle de charge et réveil par l'API web de psacc (réseau Docker interne)
      PSACC_URL: http://psacc:5000
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-sa
    volumes:
      - ../../psacc/config:/config:ro
    secrets:
      - google-sa

secrets:
  google-sa:
    file: ../../secrets/google-sa.json
