services:
  psacc:
    image: flobz/psa_car_controller:${PSACC_VERSION:-v3.7.10}
    container_name: psacc
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      # Valeur par défaut de l'image, explicitée : -r = enregistrement trajets/charges
      PSACC_OPTIONS: "-c -r --web-conf"
    ports:
      # Lié à l'IP LAN uniquement (pas 0.0.0.0)
      - "${LAN_IP:?LAN_IP manquant dans .env}:5000:5000"
    volumes:
      - ./psacc/config:/config

  psacc-sheets-sync:
    build: ./sync
    image: psacc-sheets-sync:local
    container_name: psacc-sheets-sync
    restart: unless-stopped
    depends_on:
      - psacc
    environment:
      TZ: Europe/Paris
      SPREADSHEET_ID: ${SPREADSHEET_ID:?SPREADSHEET_ID manquant dans .env}
      VIN: ${VIN:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-3600}
      DRY_RUN: ${DRY_RUN:-false}
      WAKEUP_AT: ${WAKEUP_AT-03:00,05:55}
      # Contrôle de charge et réveil par l'API web de psacc (réseau Docker interne)
      PSACC_URL: http://psacc:5000
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-sa
    volumes:
      - ./psacc/config:/config:ro
    secrets:
      - google-sa

  e208-dashboard:
    build: ./web
    image: e208-dashboard:local
    container_name: e208-dashboard
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      SPREADSHEET_ID: ${DASHBOARD_SPREADSHEET_ID:-${SPREADSHEET_ID}}
      CACHE_SECONDS: ${DASHBOARD_CACHE_SECONDS:-300}
      BASE_PRICE_KWH: ${BASE_PRICE_KWH:-}
      HCHP_HC_PRICE_KWH: ${HCHP_HC_PRICE_KWH:-}
      HCHP_HP_PRICE_KWH: ${HCHP_HP_PRICE_KWH:-}
      ZEN_LOW_PRICE_KWH: ${ZEN_LOW_PRICE_KWH:-}
      ZEN_HIGH_PRICE_KWH: ${ZEN_HIGH_PRICE_KWH:-}
      PETROL_L_100KM: ${PETROL_L_100KM:-}
      BATTERY_KWH: ${BATTERY_KWH:-}
      # SOH lu sur l'API web de psacc (réseau Docker interne)
      PSACC_URL: http://psacc:5000
      PETROL_FUEL: ${PETROL_FUEL:-sp98}
      PETROL_DEPARTEMENT: ${PETROL_DEPARTEMENT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-sa
      # Mire de connexion (accès distant via le reverse proxy Synology) ; vide = pas de mire
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
      DASHBOARD_TOTP_SECRET: ${DASHBOARD_TOTP_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      LOGIN_SCOPE: ${LOGIN_SCOPE:-proxy}
    volumes:
      # Base psacc en lecture seule, copiée avant lecture (courbes de charge)
      - ./psacc/config:/config:ro
      # Prix passés du carburant (équivalent essence des recharges), gardés entre deux redémarrages
      - dashboard-data:/data
    ports:
      # Lié à l'IP LAN uniquement (pas 0.0.0.0)
      - "${LAN_IP:?LAN_IP manquant dans .env}:${DASHBOARD_PORT:-8080}:8080"
    secrets:
      - google-sa

secrets:
  google-sa:
    file: ./secrets/google-sa.json

volumes:
  dashboard-data:
