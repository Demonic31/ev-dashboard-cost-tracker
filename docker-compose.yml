# Pile principale : services de la marque (brands/<BRAND>/docker-compose.yml, par défaut stellantis : psacc et
# synchro du Sheet), dashboard et reverse proxy facultatif.
include:
  - brands/${BRAND:-stellantis}/docker-compose.yml

services:
  ev-dashboard:
    build:
      # racine du dépôt, pour embarquer brands/<marque>/source.py (voir .dockerignore)
      context: .
      dockerfile: web/Dockerfile
    image: ev-dashboard:local
    container_name: ev-dashboard
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      SPREADSHEET_ID: ${DASHBOARD_SPREADSHEET_ID:-${SPREADSHEET_ID}}
      CACHE_SECONDS: ${DASHBOARD_CACHE_SECONDS:-300}
      BASE_PRICE_KWH: ${BASE_PRICE_KWH:-}
      HCHP_HC_PRICE_KWH: ${HCHP_HC_PRICE_KWH:-}
      HCHP_HP_PRICE_KWH: ${HCHP_HP_PRICE_KWH:-}
      ZEN_LOW_PRICE_KWH: ${ZEN_LOW_PRICE_KWH:-}
      ZEN_HIGH_PRICE_KWH: ${ZEN_HIGH_PRICE_KWH:-}
      PETROL_L_100KM: ${PETROL_L_100KM:-}
      BATTERY_KWH: ${BATTERY_KWH:-}
      # Source de données de la marque (brands/<BRAND>/source.py)
      BRAND: ${BRAND:-stellantis}
      VIN: ${VIN:-}
      PETROL_FUEL: ${PETROL_FUEL:-sp98}
      PETROL_FUELS: ${PETROL_FUELS:-}
      PETROL_DEPARTEMENT: ${PETROL_DEPARTEMENT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-sa
      # Mire de connexion (accès distant via le reverse proxy Synology) ; vide = pas de mire
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
      DASHBOARD_TOTP_SECRET: ${DASHBOARD_TOTP_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # IP du reverse proxy, ou nom de service Docker (« caddy » pour le proxy du profil « proxy » ci-dessous)
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      LOGIN_SCOPE: ${LOGIN_SCOPE:-proxy}
      # Titre « Marque Modèle » (vide = lu sur la source de la marque) et logo personnel facultatif (fichier de local/)
      VEHICLE_NAME: ${VEHICLE_NAME:-}
      DASHBOARD_LOGO: ${DASHBOARD_LOGO:-}
      DASHBOARD_LOGO_INVERT: ${DASHBOARD_LOGO_INVERT:-}
    volumes:
      # Données de la marque en lecture seule, pour les courbes de charge (stellantis : base psacc, copiée avant lecture)
      - ./psacc/config:/config:ro
      # Fichiers personnels non versionnés (logo), en lecture seule
      - ./local:/local:ro
      # Prix passés du carburant (équivalent essence des recharges), gardés entre deux redémarrages
      - dashboard-data:/data
    ports:
      # Lié à l'IP LAN uniquement (pas 0.0.0.0)
      - "${LAN_IP:?LAN_IP manquant dans .env}:${DASHBOARD_PORT:-8080}:8080"
    secrets:
      - google-sa

  # Reverse proxy « clé en main » (HTTPS Let's Encrypt automatique), à la place d'un Synology ou autre.
  # Facultatif : ne démarre qu'avec le profil « proxy » (docker compose --profile proxy up -d). Voir README.
  caddy:
    image: caddy:${CADDY_VERSION:-2.8.4-alpine}
    container_name: ev-caddy
    restart: unless-stopped
    profiles: [proxy]
    depends_on:
      - ev-dashboard
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
    ports:
      # Publics : c'est le point d'entrée depuis Internet (le dashboard, lui, reste lié au LAN)
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # certificats et clés Let's Encrypt : à garder (sinon nouvelle demande à chaque recréation)
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

secrets:
  google-sa:
    file: ./secrets/google-sa.json

volumes:
  dashboard-data:
  caddy-data:
  caddy-config:
